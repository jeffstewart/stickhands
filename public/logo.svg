<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stickhands">
  <title>Stickhands</title>
  <!--
    Matched grip, drawn from a reference photo rather than guessed. Three
    things this went through before it was right, so they don't get undone:

    1. The thumb lies ALONG the shaft pointing at the tip, not across the
       curled fingers. It's offset from the shaft's centre line so a sliver of
       stick still shows beside it instead of being fully occluded.
    2. The thumb is rooted at the SIDE of the palm, low toward the heel, and
       tapers from a wide thenar base to a rounded pad on the stick. Rooting it
       mid-palm — where the fingers meet the hand — reads as a fifth finger.
    3. The butt of the stick protrudes past the heel of the hand. Without it
       the hand looks like the end of the stick rather than a grip on it.

    The second arm is mirrored (translate + scale(-1 1)), not rotated the other
    way — rotating both by ±40 gives two right hands.

    Hand colour is deliberately non-literal warm rust; matching a skin tone is
    a choice this mark doesn't need to make. Each thumb carries a same-colour
    round-joined stroke purely to soften its corners.
  -->
  <rect width="64" height="64" rx="14" fill="#14161c"/>

  <!-- back arm -->
  <g transform="rotate(40 32 26)">
    <ellipse cx="32" cy="7.5" rx="4.4" ry="5" fill="#f2cd94"/>
    <path d="M29.1 11.3h5.8l1.4 45.5q0 3-4.3 3t-4.3-3z" fill="#f2cd94"/>
    <path fill="#d1603f" d="M23.6 41Q31.4 39 38.5 41.3C41.3 42.3 41.5 44.1 39.1 45.1C41.7 46 41.7 47.8 39.3 48.7C41.5 49.6 41.5 51.3 39 52.1C40.7 53.1 40.1 54.7 37.8 55.1Q30.7 56.5 24.9 54.7Q22.1 53.7 22.1 50.5Q21.9 44.6 23.6 41Z"/>
    <g stroke="rgba(0,0,0,.3)" stroke-width=".95" stroke-linecap="round" fill="none">
      <path d="M33.8 45.2Q36.5 45.6 39.1 45.1"/>
      <path d="M33.6 48.8Q36.4 49.2 39.3 48.7"/>
      <path d="M33.8 52.2Q36.4 52.6 39 52.1"/>
    </g>
    <path fill="#e58057" stroke="#e58057" stroke-width="1.8" stroke-linejoin="round"
          d="M20.17 49.44L27.65 35.8Q31.84 33.7 33.15 38.2L28.23 52.96Q22.76 54.5 20.17 49.44Z"/>
    <path d="M24.42 44.2Q26.9 44.6 29.18 46.28" stroke="rgba(0,0,0,.2)" stroke-width=".9"
          stroke-linecap="round" fill="none"/>
  </g>

  <!-- front arm: mirrored so the two read as a left and a right, lighter to sit in front -->
  <g transform="translate(64 0) scale(-1 1) rotate(40 32 26)">
    <ellipse cx="32" cy="7.5" rx="4.4" ry="5" fill="#ffdcab"/>
    <path d="M29.1 11.3h5.8l1.4 45.5q0 3-4.3 3t-4.3-3z" fill="#ffdcab"/>
    <path fill="#e4744d" d="M23.6 41Q31.4 39 38.5 41.3C41.3 42.3 41.5 44.1 39.1 45.1C41.7 46 41.7 47.8 39.3 48.7C41.5 49.6 41.5 51.3 39 52.1C40.7 53.1 40.1 54.7 37.8 55.1Q30.7 56.5 24.9 54.7Q22.1 53.7 22.1 50.5Q21.9 44.6 23.6 41Z"/>
    <g stroke="rgba(0,0,0,.26)" stroke-width=".95" stroke-linecap="round" fill="none">
      <path d="M33.8 45.2Q36.5 45.6 39.1 45.1"/>
      <path d="M33.6 48.8Q36.4 49.2 39.3 48.7"/>
      <path d="M33.8 52.2Q36.4 52.6 39 52.1"/>
    </g>
    <path fill="#f2926b" stroke="#f2926b" stroke-width="1.8" stroke-linejoin="round"
          d="M20.17 49.44L27.65 35.8Q31.84 33.7 33.15 38.2L28.23 52.96Q22.76 54.5 20.17 49.44Z"/>
    <path d="M24.42 44.2Q26.9 44.6 29.18 46.28" stroke="rgba(0,0,0,.17)" stroke-width=".9"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
