<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Stickhands">
  <title>Stickhands</title>
  <!--
    The small-size reduction of logo.svg: the same crossed sticks at the same
    angle and pivot, with the hands dropped. At 16-20px the fists collapse into
    two coloured specks and only muddy the X, so this keeps the silhouette that
    still reads and lets the full mark do the talking wherever there's room.
    Shafts are a touch thicker than a straight scale-down — optical sizing, so
    the strokes survive a 16px grid.
  -->
  <rect width="64" height="64" rx="14" fill="#14161c"/>
  <g transform="rotate(40 32 26)">
    <ellipse cx="32" cy="10" rx="5.2" ry="5.8" fill="#f2cd94"/>
    <path d="M28.4 14.2h7.2l1.6 40q0 3.4-5.2 3.4t-5.2-3.4z" fill="#f2cd94"/>
  </g>
  <g transform="translate(64 0) scale(-1 1) rotate(40 32 26)">
    <ellipse cx="32" cy="10" rx="5.2" ry="5.8" fill="#ffdcab"/>
    <path d="M28.4 14.2h7.2l1.6 40q0 3.4-5.2 3.4t-5.2-3.4z" fill="#ffdcab"/>
  </g>
</svg>
